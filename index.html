 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Builder</title>
<link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
 <h1 class="no-print">Resume Builder</h1>

    <div class="container no-print">

        <form id="resumeForm">

            <label>Full Name</label>
            <input type="text" id="name" placeholder="Enter your full name" required>

            <label>Career Title</label>
            <input type="text" id="title" placeholder="Example: Aspiring Software Developer" required>

            <label>Email Address</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label>Phone Number</label>
            <input type="tel" id="phone" placeholder="Enter your phone number">

            <label>Career Objective</label>
            <textarea id="objective" placeholder="Write your career objective" required></textarea>

            <label>Education</label>
            <textarea id="education" placeholder="B.Sc. Information Technology&#10;KG College of Arts and Science" required></textarea>

            <label>Skills</label>
            <textarea id="skills" placeholder="HTML, CSS, JavaScript, Java, C Programming" required></textarea>

            <label>Projects</label>
            <textarea id="projects" placeholder="Student Portfolio Website&#10;Resume Builder" required></textarea>

            <button type="submit">Generate Resume</button>
            <button type="reset">Clear Form</button>

        </form>
    </div>

    <div id="resume">

        <h2 id="rName"></h2>

        <p><strong id="rTitle"></strong></p>

        <p id="rContact"></p>

        <h3>Career Objective</h3>
        <div id="rObjective" class="resume-text"></div>

        <h3>Education</h3>
        <div id="rEducation" class="resume-text"></div>

        <h3>Technical Skills</h3>
        <div id="rSkills" class="resume-text"></div>

        <h3>Projects</h3>
        <div id="rProjects" class="resume-text"></div>

        <div class="no-print">
            <button onclick="window.print()">Print / Save as PDF</button>
        </div>

    </div>
